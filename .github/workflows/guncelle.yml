name: Tutanakları güncelle ve yayınla

on:
  schedule:
    # Türkiye saatiyle 09:00 ve 21:00 (UTC+3)
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      donem:
        description: "Geriye dönük indirme için dönem (ör. 28) — boş bırakılırsa günlük tarama"
        required: false
      yil:
        description: "Geriye dönük indirme için yasama yılı (ör. 4)"
        required: false
  push:
    branches: [main]

# Varsayılan olarak hiçbir yetki yok; her iş yalnızca ihtiyaç duyduğunu alır
permissions: {}

concurrency:
  group: tbmm
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # yeni tutanakları repoya commit'lemek için
    steps:
      # Eylemler değiştirilemez commit kimliklerine sabitlenmiştir (Dependabot günceller)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur (sürüm ve sağlama toplamı sabit)
        run: pip install --require-hashes -r requirements.txt

      - name: TBMM'yi tara
        # Kod değişikliği push'larında tarama yapma, sadece siteyi yeniden üret
        if: github.event_name != 'push'
        env:
          DONEM: ${{ inputs.donem }}
          YIL: ${{ inputs.yil }}
        run: |
          if [ -n "$DONEM" ] || [ -n "$YIL" ]; then
            if ! [[ "$DONEM" =~ ^[0-9]{1,2}$ && "$YIL" =~ ^[0-9]$ ]]; then
              echo "Dönem 1-2 haneli, yasama yılı tek haneli bir sayı olmalı." >&2
              exit 1
            fi
            python tbmm_tutanak.py --arayuzsuz --donem "$DONEM" --yil "$YIL"
          else
            python tbmm_tutanak.py --arayuzsuz
          fi

      - name: Yeni verileri kaydet
        if: github.event_name != 'push'
        run: |
          git config user.name "tbmm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state.json
          if git diff --cached --quiet; then
            echo "Yeni tutanak yok."
          else
            git commit -m "Tutanak güncellemesi $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Siteyi üret
        run: python arayuz.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  yayinla:
    needs: guncelle
    runs-on: ubuntu-latest
    permissions:
      pages: write     # GitHub Pages'e yayınlamak için
      id-token: write  # Pages dağıtımının kimlik doğrulaması için
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
